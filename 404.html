<meta name="color-scheme" content="light dark">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script>
(function () {
  var d = document.documentElement, m = null;
  d.className += ' js';
  try { m = localStorage.getItem('flow-modus'); } catch (e) {}
  if (m !== 'tag' && m !== 'nacht') {
    var dunkel = false;
    try { dunkel = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
    var h = new Date().getHours();
    m = (dunkel || h >= 20 || h < 6) ? 'nacht' : 'tag';
  }
  d.setAttribute('data-modus', m);
})();
</script>
